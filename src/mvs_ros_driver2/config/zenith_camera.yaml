%YAML:1.0

#--------------------------------------------------------------------------------------------
# Zenith Drone - Hikrobot MV-CU013-A0UC Camera Configuration
#--------------------------------------------------------------------------------------------

# Serial number (leave blank or comment if single camera)
# SerialNumber: "DA7036691"

# Topic Name published to ROS 2
TopicName: "/camera/image_raw"

# Hardware Trigger: 0 for Free-run (Continuous USB 10Hz), 1 for Hardware Pin Trigger
TriggerEnable: 0

# Frame Rate (Hz) for Free-run mode (10.0 Hz matches Livox LiDAR & FAST-LIVO2 paper)
FrameRate: 10.0

# Exposure Settings
# ExposureAutoMode: 0 = Off, 1 = Once, 2 = Continuous
ExposureAutoMode: 2
ExposureTime: 15000 # us (used when ExposureAutoMode is 0)
AutoExposureTimeLower: 500
AutoExposureTimeUpper: 20000

# Image & Gain Settings
image_scale: 0.5   # 0.5 for downsampled 640x512 (75% memory reduction)
GainAuto: 2        # 0 = Off, 1 = Once, 2 = Continuous
Gain: 10.0         # min: 0, max: 17.0
Gamma: 0.7
GammaSelector: 1   # 0 = user, 1 = sRGB

# Pixel Format: 0: RGB8, 1: BayerRG8, 2: BayerRG12Packed, 3: BayerGB12Packed, 4: BayerGB8
PixelFormat: 4
